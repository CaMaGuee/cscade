<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#317EFB">
    <link rel="icon" type="image/png" href="favicon_512.png?v=2">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="apple-touch-icon" href="favicon_192.png?v=2">
    <link rel="shortcut icon" href="favicon.ico?v=2">
    <script src="./GameScripts.js"></script>
    
    <title>CSGAME</title>

    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background:#2f3b6a; 
            overflow: hidden;   /* ← 스크롤 완전 차단 */
            font-family: 'Galmuri9', monospace;
            
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        html::-webkit-scrollbar { width:0px; background:transparent; }
        html { scrollbar-width:none; -ms-overflow-style:none; }
        body {
            background:#2f3b6a;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            user-select: none;
            height: 100svh;  /* 모바일 안전 높이 */
        }
        button {
            font-family: inherit;
        }

        .game-btn-section-body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90svh;
        }

        .game-btn-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px; /* 간격은 필요에 따라 조절 */
        }

        .game-btn {
            width: 100%;
            max-width: 100px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .game-btn img {
            width: 100px;
            height: 100px;
            display: block;
            filter: blur(0px);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .game-btn p {
            margin-top: 5px;
            font-size: 16px;
            color: #dbdbdb;
        }

        .game-btn img:hover{
            transform: scale(1.03);
            filter: blur(0.75px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .SPA_PAGE {
            display: none;
        }

        #board-body {
            width: 370px;
            height: 370px;

            display: flex;
            flex-direction: row;

            justify-content: center;
            align-items: center;

            background-color: #1f274f;
            border-radius: 6px;

            overflow: hidden;
            box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        #board-2048-body {
            width: 370px;
            height: 370px;

            display: flex;
            flex-direction: row;

            justify-content: center;
            align-items: center;

            background-color: #1f274f;
            border-radius: 6px;

            overflow: hidden;
            box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #1f274f;
            touch-action: none;
            border-radius: 6px;
        }

        #board-2048 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: #1f274f;
            touch-action: none;
            border-radius: 6px;
        }

        .cell {
            width: 32px;
            height: 32px;
            background: #ffffff50;
            border-radius: 4px;
        }

        .cell-2048 {
            width: 80px;
            height: 80px;
            background: #ffffff50;
            border-radius: 4px;
        }

        .game-over-cell {
            background: #bf360c50;
        }

        .filled {
            background: #4fc3f7 !important;
        }

        .canPlace {
            background: #ffeb3b90;
        }

        #blocks {
            margin-top: 20px;
            width: 330px;
            height: 130px;
            padding: 10px 20px 10px 20px;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;

            background-color: #2a3360;
            border-radius: 6px;

            overflow: hidden;
            box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .block {
            touch-action: none;
            display: grid;
            gap: 2px;
            grid-auto-rows: 28px;
        }

        .block-cell {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            margin: 0px;
            padding: 0px;
        }

        .ghost {
            position: fixed;
            pointer-events: none;
            opacity: 0.7;
            z-index: 1000;
        }

        .cell.clearing {
            animation: vanishOut 0.4s ease forwards;
        }

        @-webkit-keyframes vanishOut {
            0% {
                opacity: 1;
                transform-origin: 50% 50%;
                transform: scale(1, 1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform-origin: 50% 50%;
                transform: scale(2, 2);
                filter: blur(20px);
            }
        }

        @keyframes vanishOut {
            0% {
                opacity: 1;
                transform-origin: 50% 50%;
                transform: scale(1, 1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform-origin: 50% 50%;
                transform: scale(2, 2);
                filter: blur(20px);
            }
        }

        #score {
            color: #ffeb3b;
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
            font-size: 14px;
            font-weight: 600;
            min-width: 90px;
        }

        #blocks-refresh {
            margin-top: 20px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
        }

        #blocks-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
        }

        #blocks-refresh:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #blocks-refresh:focus {
            outline: none;
        }

        #refresh-count {
            font-size: 14px;
            font-weight: 600;
            color: #bcdcff;
            min-width: 90px;
        }
        
        #body-wrapper {
            transform-origin: top center;
        }

        @media (max-width: 480px) {
            #body-wrapper {
                transform: scale(0.85);
            }
        }

        .arrow-btn{
            display: flex;
            width: 80px; 
            height: 80px;
            background: none; 
            border: none; 
            padding: 0; 
            cursor: pointer;
        }

        .arrow-btn:hover {
            
        }

        .arrow-btn:active {
            transform: translateY(2px);
        }
    </style>
</head>

<body>
    <a href="https://camaguee.github.io/cscade/"><img src="favicon.png" style="width:85px;"></a>
    <div id="installBtn-body" style="z-index: 9999;">
        <button id="installBtn" style="
            position:fixed;
            right:10px;
            top:10px;
            background: none;
            border: none;
            padding: 0;
            outline: none;
            color: white;
            font-size: 14px;
            font-weight: 500;
        ">앱 설치</button>
        
        <div id="iosPopup" style="display:none; position:fixed; inset:0; background:#0008;">
            <div style="
                background:#1f274f;
                color:white;
                padding:20px;
                border-radius:8px;
                width:260px;
                margin:40% auto;
                text-align:center;
                font-weight: 14px;
            ">
                <p>Safari 하단의</p>
                <p><b>"···" - "공유 버튼"</b>을 누른 후</p>
                <p><b>“더보기" - "홈 화면에 추가”</b>를 선택해주세요.</p>
                <button onclick="this.parentElement.parentElement.style.display='none'" style="
                    position:fixed;
                    background: none;
                    border: none;
                    padding: 0;
                    outline: none;
                    color: white;
                    font-size: 14px;
                    font-weight: 500;
                ">확인</button>
            </div>
        </div>
    </div>
    <div id="body-wrapper">
        <div class="game-btn-section-body">
            <div class="game-btn-section">
                <button class="game-btn" id="BlockPuzzleBtn">
                    <img src="block_puzzle_icon.png" alt="Block Puzzle">
                    <p>Block<br>Puzzle</p>
                </button>
                <div class="game-btn btn-dummy"></div>
                <button class="game-btn" id="Block2048Btn">
                    <img src="block_2048_icon.png" alt="Block Puzzle">
                    <p><br>2048</p>
                </button>
            </div>
        </div>

        <div class="SPA_PAGE" id="BlockPuzzle">
            <div id="board-body">
                <div id="board"></div>
            </div>
            <div id="blocks"></div>

            <div style="margin-top:2px; display:flex; align-items:center; justify-content: center; gap:12px;">
                <p>남은 시간 :</p>
                <div id="turn-timer" style="width: 30px; height: 100%; font-size: 20px; font-weight: 700;">--</div>
                <button id="blocks-refresh">Refresh</button>
                <div style="margin-top:15px; display:flex; flex-direction:column; align-items:center;">
                    <div id="score">Score: 0</div>
                    <div id="refresh-count">남은 횟수: 3</div>
                </div>
            </div>
        </div>
        <div class="SPA_PAGE" id="block2048">
            <div id="board-2048-body">
                <div id="board-2048"></div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center;">
                <div style="margin-top:20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                    <div></div>
                    <button class="arrow-btn" id="up-btn">
                        <img src="arrow.png" style="width: 100%; transform: rotate(270deg);" alt="up">
                    </button>
                    <div></div>
                    <button id="left-btn">
                        <img src="arrow.png" style="width: 100%; transform: scaleX(-1);" alt="left">
                    </button>
                    <button id="down-btn">
                        <img src="arrow.png" style="width: 100%; transform: rotate(90deg);" alt="down">
                    </button>
                    <button id="right-btn">
                        <img src="arrow.png" style="width: 100%;" alt="right">
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    function isIOS(){
        return /iphone|ipad|iod/i.test(navigator.userAgent);
    }
    
    function isStandalone(){
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }

    let deferredPrompt = null;

    if(isStandalone()){
        document.getElementById("installBtn-body").style.display = "none";
    } else {
        document.getElementById("installBtn-body").style.display = "block";
    }

    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault(); //자동 팝업 차단
        deferredPrompt = e; //나중에 사용
    })

    document.getElementById("installBtn").addEventListener("pointerup", async () => {

        //이미 설치됨
        if(isStandalone()) {
            return;
        }

        if(isIOS()){
            document.getElementById("iosPopup").style.display = "block";
            return;
        } else {
            if(deferredPrompt){
                deferredPrompt.prompt();

                const {outcome} = await deferredPrompt.userChoice;
                deferredPrompt = null;
                return;
            }
        }

        alert("이 브라우저는 설치를 지원하지 않습니다.");
    })

    document.getElementById("BlockPuzzleBtn").addEventListener("click", () => {
        navigate("BlockPuzzle");
    
        // 👇 레이아웃이 잡힌 다음 실행
        requestAnimationFrame(() => {
            initBlockPuzzle(false);
        });
    });
    document.getElementById("Block2048Btn").addEventListener("click", () => {
        navigate("block2048");
    
        // 👇 레이아웃이 잡힌 다음 실행
        requestAnimationFrame(() => {
            initBlock2048();
        });
    });
</script>
</html>
